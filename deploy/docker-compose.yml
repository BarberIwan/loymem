# Test environment: everything on one server. Secrets come from deploy/.env
# (copy deploy/env.example); that file is never committed.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  migrate:
    build: ../backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    # Every minute: mail, the next group of free-slot offers, wallet pass updates.
    # Every night at 03:00: memberships and the balance check.
    command:
      - sh
      - -c
      - |
        while true; do
          python scripts/send_slot_groups.py; python scripts/send_outbox.py
          python scripts/send_wallet_updates.py
          if [ "$$(date +%H%M)" = "0300" ]; then
            python scripts/memberships_daily.py; python scripts/check_balances.py
          fi
          sleep 60
        done
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      LOYMEM_API_URL: http://api:8000
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      LOYMEM_DOMAIN: ${LOYMEM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web]

volumes:
  db:
  caddy:
